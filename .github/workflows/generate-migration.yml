on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  generate_migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Create migration files without applying them to DB
      - name: Create initial migration (create-only)
        run: npx prisma migrate dev --name init --create-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Show generated migrations
        run: ls -R prisma/migrations

      - name: Commit and push migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "chore(db): add initial prisma migration" || echo "Nothing to commit"
          git push
